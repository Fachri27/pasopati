; Batas unggah PHP untuk CMS Event/Kejadian (gambar & video maks 100 MB).
;
; Dibaca oleh PHP-FPM/CGI untuk skrip di dalam direktori ini (public/index.php),
; jadi batasnya ikut ter-versioning bersama kode — bukan menempel di konfigurasi
; satu server saja. Perubahan di sini menyusul cache user.ini (bawaan 5 menit);
; `sudo nginx -s reload` atau restart PHP-FPM bila ingin langsung berlaku.
;
; Sengaja LEBIH LONGGAR dari aturan validasi Laravel (max:102400 = 100 MB di
; StoreEventRequest/UpdateEventRequest). Kalau PHP yang menolak lebih dulu,
; berkasnya hilang dari request dan admin cuma melihat pesan generik; dengan
; ambang PHP sedikit di atas, Laravel yang menolak dan pesan "Ukuran video
; maksimal 100 MB." benar-benar muncul.
;
; post_max_size harus lebih besar dari upload_max_filesize: satu request memuat
; video + dua gambar + kolom teks + overhead multipart.

upload_max_filesize = 120M
post_max_size = 256M
